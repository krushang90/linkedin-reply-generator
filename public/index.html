<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Reply Generator — Yashvi</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0a66c2;
      --blue-light: #e8f0fb;
      --blue-dark: #004182;
      --text: #1c1c1c;
      --text-muted: #666;
      --border: #dde1e7;
      --bg: #f4f5f7;
      --white: #ffffff;
      --green: #057642;
      --green-light: #e6f4ec;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .logo svg { width: 28px; height: 28px; }

    header h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }

    header .badge {
      background: var(--blue-light);
      color: var(--blue);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    header .logout {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.15s;
    }

    header .logout:hover { background: var(--bg); color: var(--text); }

    main {
      flex: 1;
      max-width: 760px;
      width: 100%;
      margin: 32px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .company-toggle {
      display: flex;
      gap: 10px;
    }

    .company-btn {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .company-btn:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .company-btn.active {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .company-btn .name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .company-btn .desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .company-btn.active .name { color: var(--blue); }

    .reply-type-toggle {
      display: flex;
      gap: 8px;
    }

    .reply-type-btn {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .reply-type-btn:hover {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--blue);
    }

    .reply-type-btn.active {
      border-color: var(--blue);
      background: var(--blue-light);
      color: var(--blue);
    }

    .reply-type-btn .type-icon {
      font-size: 16px;
      display: block;
      margin-bottom: 3px;
    }

    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      resize: vertical;
      transition: border-color 0.15s;
      outline: none;
      line-height: 1.5;
    }

    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,102,194,0.1); }

    textarea::placeholder { color: #aaa; }

    #comment { min-height: 100px; }
    #context { min-height: 60px; }

    .optional-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .optional-label span {
      font-size: 11px;
      color: #aaa;
      font-weight: 500;
      text-transform: uppercase;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .generate-btn:hover:not(:disabled) { background: var(--blue-dark); }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .output-card { display: none; }
    .output-card.visible { display: block; }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .output-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--white);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s;
    }

    .copy-btn:hover { background: var(--bg); border-color: #bbb; }

    .copy-btn.copied {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-light);
    }

    .output-text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      min-height: 60px;
    }

    .output-text .cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: var(--blue);
      margin-left: 1px;
      animation: blink 0.8s step-end infinite;
      vertical-align: middle;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .regen-btn {
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--white);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .regen-btn:hover { background: var(--bg); color: var(--text); }

    .output-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .email-now-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid #0a66c2;
      border-radius: 6px;
      background: var(--blue-light);
      font-size: 13px;
      font-weight: 600;
      color: var(--blue);
      cursor: pointer;
      transition: all 0.15s;
    }

    .email-now-btn:hover { background: var(--blue); color: white; }
    .email-now-btn.visible { display: flex; }

    .recipient-field {
      display: none;
      margin-top: 18px;
    }

    .recipient-field.visible { display: block; }

    .recipient-field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .recipient-field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,102,194,0.1); }
    .recipient-field input::placeholder { color: #aaa; }

    .char-counter {
      display: none;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
    }

    .char-counter.visible { display: block; }
    .char-counter.over { color: #c0392b; font-weight: 600; }

    .error-msg {
      background: #fff5f5;
      border: 1px solid #fcc;
      color: #c0392b;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      display: none;
    }

    .error-msg.visible { display: block; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #aaa;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="4" fill="#0a66c2"/>
      <path d="M6.5 9.5H4v9h2.5v-9zM5.25 8.25a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM10 18.5h-2.5V9.5H10v1.3c.6-.9 1.7-1.55 3-1.55 2.2 0 3.5 1.5 3.5 4.2v5.05H14V13.7c0-1.5-.5-2.5-1.8-2.5-1.2 0-2 .8-2.2 1.7v5.6z" fill="white"/>
    </svg>
    <h1>LinkedIn Reply Generator</h1>
  </div>
  <span class="badge">Yashvi</span>
  <a href="/logout" class="logout">Sign out</a>
</header>

<main>
  <div class="card">
    <label>Which company is this for?</label>
    <div class="company-toggle">
      <button class="company-btn active" data-value="yashvi_global" onclick="selectCompany(this)">
        <div class="name">Yashvi Global</div>
        <div class="desc">360° digital marketing + software dev</div>
      </button>
      <button class="company-btn" data-value="yashvi_konnect" onclick="selectCompany(this)">
        <div class="name">Yashvi Konnect</div>
        <div class="desc">E-commerce focused services</div>
      </button>
    </div>
  </div>

  <div class="card">
    <label>What type of reply do you need?</label>
    <div class="reply-type-toggle">
      <button class="reply-type-btn active" data-value="comment" onclick="selectReplyType(this)">
        <span class="type-icon">💬</span>Post Comment
      </button>
      <button class="reply-type-btn" data-value="dm" onclick="selectReplyType(this)">
        <span class="type-icon">✉️</span>Direct Message
      </button>
      <button class="reply-type-btn" data-value="email" onclick="selectReplyType(this)">
        <span class="type-icon">📧</span>Email
      </button>
      <button class="reply-type-btn" data-value="connection_request" onclick="selectReplyType(this)">
        <span class="type-icon">🤝</span>Connection Request
      </button>
    </div>
  </div>

  <div class="card">
    <label for="comment">Message or post to reply to</label>
    <textarea id="comment" placeholder="Paste the comment, message, or email you want to reply to…"></textarea>

    <div style="margin-top: 18px;">
      <div class="optional-label">
        <label for="context" style="margin-bottom:0;">Context</label>
        <span>optional</span>
      </div>
      <textarea id="context" placeholder="Any extra context? e.g. 'They run a Shopify store with 10k monthly visitors' or 'They asked about pricing'"></textarea>
    </div>

    <div class="recipient-field" id="recipientField">
      <div class="optional-label" style="margin-top:18px;">
        <label for="recipientEmail" style="margin-bottom:0;">Recipient Email</label>
        <span>optional</span>
      </div>
      <input type="email" id="recipientEmail" placeholder="e.g. john@example.com" />
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generate()" style="margin-top: 20px;">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Generate Reply</span>
    </button>

    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card output-card" id="outputCard">
    <div class="output-header">
      <div class="output-title" id="outputTitle">Generated Reply</div>
      <button class="copy-btn" id="copyBtn" onclick="copyReply()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        Copy
      </button>
    </div>
    <div class="output-text" id="outputText"></div>
    <div class="char-counter" id="charCounter">0 / 300 characters</div>
    <div class="output-actions">
      <button class="regen-btn" onclick="generate()">Regenerate</button>
      <button class="email-now-btn" id="emailNowBtn" onclick="openEmail()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        Email Now
      </button>
    </div>
  </div>
</main>

<footer>Powered by Claude · Yashvi Global &amp; Yashvi Konnect</footer>

<script>
  let selectedCompany = "yashvi_global";
  let selectedReplyType = "comment";
  let fullReply = "";

  const replyTypeLabels = {
    comment: "Post Comment Reply",
    dm: "Direct Message",
    email: "Email",
    connection_request: "Connection Request"
  };

  function selectCompany(btn) {
    document.querySelectorAll(".company-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedCompany = btn.dataset.value;
  }

  function selectReplyType(btn) {
    document.querySelectorAll(".reply-type-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedReplyType = btn.dataset.value;
    const isEmail = selectedReplyType === "email";
    const isConnection = selectedReplyType === "connection_request";
    document.getElementById("recipientField").classList.toggle("visible", isEmail);
    document.getElementById("emailNowBtn").classList.toggle("visible", isEmail && !!fullReply);
    document.getElementById("charCounter").classList.toggle("visible", isConnection && !!fullReply);
  }

  async function generate() {
    const comment = document.getElementById("comment").value.trim();
    const context = document.getElementById("context").value.trim();

    if (!comment) {
      showError("Please paste a comment or message to reply to.");
      return;
    }

    hideError();
    setLoading(true);
    fullReply = "";

    const outputCard = document.getElementById("outputCard");
    const outputText = document.getElementById("outputText");
    const outputTitle = document.getElementById("outputTitle");
    outputTitle.textContent = replyTypeLabels[selectedReplyType] || "Generated Reply";
    outputCard.classList.add("visible");
    outputText.innerHTML = '<span class="cursor"></span>';

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comment, company: selectedCompany, context, replyType: selectedReplyType }),
      });

      if (!res.ok) {
        let message = `Server error (${res.status})`;
        try { const err = await res.json(); message = err.error || message; } catch {}
        throw new Error(message);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split("\n");

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = JSON.parse(line.slice(6));
          if (data.error) throw new Error(data.error);
          if (data.done) break;
          if (data.text) {
            fullReply += data.text;
            outputText.innerHTML = escapeHtml(fullReply) + '<span class="cursor"></span>';
            if (selectedReplyType === "connection_request") updateCharCounter();
          }
        }
      }

      outputText.textContent = fullReply;
      if (selectedReplyType === "email") {
        document.getElementById("emailNowBtn").classList.add("visible");
      }
      if (selectedReplyType === "connection_request") {
        updateCharCounter();
        document.getElementById("charCounter").classList.add("visible");
      }
    } catch (err) {
      outputCard.classList.remove("visible");
      showError(err.message);
    } finally {
      setLoading(false);
    }
  }

  function updateCharCounter() {
    const counter = document.getElementById("charCounter");
    const len = fullReply.length;
    counter.textContent = `${len} / 300 characters`;
    counter.classList.toggle("over", len > 300);
  }

  function openEmail() {
    if (!fullReply) return;
    const lines = fullReply.split("\n");
    let subject = "";
    let bodyStart = 0;

    // Parse "Subject: ..." from first non-empty line
    for (let i = 0; i < lines.length; i++) {
      const trimmed = lines[i].trim();
      if (trimmed.toLowerCase().startsWith("subject:")) {
        subject = trimmed.slice(8).trim();
        bodyStart = i + 1;
        break;
      }
    }

    // Skip blank lines after subject
    while (bodyStart < lines.length && lines[bodyStart].trim() === "") bodyStart++;

    const body = lines.slice(bodyStart).join("\n");
    const to = document.getElementById("recipientEmail").value.trim();
    const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }

  function copyReply() {
    if (!fullReply) return;
    navigator.clipboard.writeText(fullReply).then(() => {
      const btn = document.getElementById("copyBtn");
      btn.classList.add("copied");
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
      }, 2000);
    });
  }

  function setLoading(on) {
    const btn = document.getElementById("generateBtn");
    const spinner = document.getElementById("spinner");
    const text = document.getElementById("btnText");
    btn.disabled = on;
    spinner.style.display = on ? "block" : "none";
    text.textContent = on ? "Generating…" : "Generate Reply";
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.classList.add("visible");
  }

  function hideError() {
    document.getElementById("errorMsg").classList.remove("visible");
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  document.getElementById("comment").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
  });
</script>

</body>
</html>
