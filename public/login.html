<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — LinkedIn Reply Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0a66c2;
      --blue-dark: #004182;
      --blue-light: #e8f0fb;
      --text: #1c1c1c;
      --text-muted: #666;
      --border: #dde1e7;
      --bg: #f4f5f7;
      --white: #ffffff;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 380px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo svg { width: 28px; height: 28px; }

    .logo h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(10,102,194,0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    button:hover { background: var(--blue-dark); }

    .error {
      background: #fff5f5;
      border: 1px solid #fcc;
      color: #c0392b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="4" fill="#0a66c2"/>
        <path d="M6.5 9.5H4v9h2.5v-9zM5.25 8.25a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM10 18.5h-2.5V9.5H10v1.3c.6-.9 1.7-1.55 3-1.55 2.2 0 3.5 1.5 3.5 4.2v5.05H14V13.7c0-1.5-.5-2.5-1.8-2.5-1.2 0-2 .8-2.2 1.7v5.6z" fill="white"/>
      </svg>
      <h1>LinkedIn Reply Generator</h1>
    </div>

    <div id="errorMsg" class="error" style="display:none">Invalid username or password.</div>

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("errorMsg").style.display = "block";
    }
  </script>
</body>
</html>
